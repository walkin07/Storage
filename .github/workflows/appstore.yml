name: App Store images

# 앱 스토어에 올릴 이미지(아이폰 스크린샷 6장 1320×2868 + 헤더 1920×1080 + 아이패드 스크린샷 6장 2064×2752)를
# 실제 앱 화면으로 만든다. 6.9형 iPhone과 13형 iPad 시뮬레이터에서 화면을 찍고(AppStoreScreenshots UI 테스트),
# AppStore/compose.py가 문구와 기기 틀을 입힌다.
# 결과는 "screenqr-appstore" 릴리스에 올라간다. Actions 탭에서 직접 실행하거나 아래 파일이 바뀌면 실행된다.
on:
  workflow_dispatch:
  push:
    paths:
      - "AppStore/**"
      - "ScreenQRUITests/AppStoreScreenshots.swift"
      - ".github/workflows/appstore.yml"

jobs:
  images:
    runs-on: xcode-27
    permissions:
      contents: write
    concurrency:
      group: screenqr-appstore
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 27.1
        run: |
          XCODE=/Applications/Xcode_27.1.app
          [ -d "$XCODE" ] || XCODE=$(ls -d /Applications/Xcode_27*.app | grep -v -i -E "beta|candidate" | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Pick the simulators (6.9-inch iPhone, 13-inch iPad)
        run: |
          cat > "$RUNNER_TEMP/pick.py" <<'PY'
          import json, sys
          want = sys.argv[1]
          best = None
          for runtime, items in json.load(sys.stdin)["devices"].items():
              if "iOS-26" not in runtime and "iOS-27" not in runtime:
                  continue
              for device in items:
                  name = device["name"]
                  if want == "iphone":
                      # 1320×2868 (App Store 6.9형). 17 Pro Max를 먼저 고른다.
                      if not name.startswith("iPhone") or "Pro Max" not in name:
                          continue
                      score = (name == "iPhone 17 Pro Max", runtime, name)
                  else:
                      # 2064×2752 (App Store 13형)
                      if not name.startswith("iPad Pro 13-inch"):
                          continue
                      score = (runtime, name)
                  if best is None or score > best[0]:
                      best = (score, device["udid"], name, runtime)
          print(f"{best[1]} {best[2]} {best[3]}" if best else "")
          PY
          IPHONE=$(xcrun simctl list devices available -j | python3 "$RUNNER_TEMP/pick.py" iphone)
          IPAD=$(xcrun simctl list devices available -j | python3 "$RUNNER_TEMP/pick.py" ipad)
          echo "iPhone: $IPHONE"
          echo "iPad: $IPAD"
          test -n "$IPHONE" && test -n "$IPAD"
          echo "IPHONE=${IPHONE%% *}" >> "$GITHUB_ENV"
          echo "IPAD=${IPAD%% *}" >> "$GITHUB_ENV"
      - name: Boot the simulators with a clean status bar (9:41)
        run: |
          for UDID in "$IPHONE" "$IPAD"; do
            xcrun simctl boot "$UDID" || true
            xcrun simctl bootstatus "$UDID" -b
            xcrun simctl status_bar "$UDID" override --time "9:41" \
              --dataNetwork wifi --wifiMode active --wifiBars 3 \
              --cellularMode active --cellularBars 4 \
              --batteryState discharging --batteryLevel 100
          done
      - name: Capture screens
        run: |
          set -o pipefail
          for DEVICE in iphone ipad; do
            if [ "$DEVICE" = iphone ]; then UDID="$IPHONE"; else UDID="$IPAD"; fi
            xcodebuild test -project ScreenQR.xcodeproj -scheme ScreenQR \
              -destination "id=$UDID" -resultBundlePath "Shots-$DEVICE.xcresult" \
              -only-testing:ScreenQRUITests/AppStoreScreenshots \
              CODE_SIGNING_ALLOWED=NO 2>&1 | tee "test-$DEVICE.log" | grep -E "Test (Case|Suite)|error:|\*\* TEST" || true
            grep -q "\*\* TEST SUCCEEDED \*\*" "test-$DEVICE.log"
          done
      - name: Show test errors
        if: failure()
        run: |
          grep -h -E "error:|failed|XCTAssert" test-*.log | sort -u | head -80 || true
      - name: Export raw screens
        run: |
          for DEVICE in iphone ipad; do
            xcrun xcresulttool export attachments --path "Shots-$DEVICE.xcresult" --output-path "raw-export-$DEVICE"
            python3 - "raw-export-$DEVICE" "raw-$DEVICE" <<'PY'
          import json, os, re, shutil, sys
          source, target = sys.argv[1], sys.argv[2]
          os.makedirs(target, exist_ok=True)
          for test in json.load(open(os.path.join(source, "manifest.json"))):
              for item in test.get("attachments", []):
                  exported = item.get("exportedFileName") or ""
                  label = item.get("suggestedHumanReadableName") or ""
                  match = re.match(r"(\d+-[a-z]+)_", label)
                  if match and exported.lower().endswith(".png"):
                      shutil.copy(os.path.join(source, exported), os.path.join(target, match.group(1) + ".png"))
          print(target, sorted(os.listdir(target)))
          PY
            sips -g pixelWidth -g pixelHeight "raw-$DEVICE"/*.png
          done
      - name: Compose App Store images
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet pillow
          "$RUNNER_TEMP/venv/bin/python" AppStore/compose.py raw-iphone out
          "$RUNNER_TEMP/venv/bin/python" AppStore/compose.py --ipad raw-ipad out
          sips -g pixelWidth -g pixelHeight out/*.png
      - uses: actions/upload-artifact@v4
        with:
          name: ScreenQR-AppStore-images
          path: out/*.png
      - name: Publish "screenqr-appstore" release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          (cd out && zip -q ../ScreenQR-AppStore-images.zip *.png)
          TITLE="Screen QR Scanner 앱 스토어 이미지"
          NOTES="screenshot-1~6: 1320×2868 (6.9형 iPhone, App Store Connect에 순서대로 올리면 검색 결과에는 앞의 3장이 나와요) · ipad-screenshot-1~6: 2064×2752 (13형 iPad) · header-1920x1080: 헤더/홍보 이미지 · ScreenQR-AppStore-images.zip: 전부 (커밋 ${GITHUB_SHA::7})"
          if gh release view screenqr-appstore >/dev/null 2>&1; then
            gh release upload screenqr-appstore out/*.png ScreenQR-AppStore-images.zip --clobber
            gh release edit screenqr-appstore --title "$TITLE" --notes "$NOTES"
          else
            gh release create screenqr-appstore out/*.png ScreenQR-AppStore-images.zip --target "$GITHUB_SHA" --prerelease --title "$TITLE" --notes "$NOTES"
          fi
      - name: Print images (base64, for review)
        run: |
          mkdir -p preview
          # 원본 크기 이미지는 릴리스에 있으니, 로그에는 확인용으로 줄여서 남긴다.
          for f in out/*.png; do
            sips -s format jpeg -s formatOptions 85 --resampleWidth 900 "$f" --out "preview/$(basename "${f%.png}").jpg" >/dev/null
          done
          ls -la preview
          for f in preview/*.jpg; do
            echo "=====BEGIN $(basename "$f")====="
            base64 -b 4000 -i "$f"
            echo "=====END $(basename "$f")====="
          done
