name: App Store images

# 앱 스토어에 올릴 이미지(스크린샷 6장 1320×2868 + 헤더 1920×1080)를 실제 앱 화면으로 만든다.
# 6.9형 iPhone 시뮬레이터에서 화면을 찍고(AppStoreScreenshots UI 테스트), AppStore/compose.py가 문구와 기기 틀을 입힌다.
# 결과는 "screenqr-appstore" 릴리스에 올라간다. Actions 탭에서 직접 실행하거나 아래 파일이 바뀌면 실행된다.
on:
  workflow_dispatch:
  push:
    paths:
      - "AppStore/**"
      - "ScreenQRUITests/AppStoreScreenshots.swift"
      - ".github/workflows/appstore.yml"

jobs:
  images:
    runs-on: macos-15
    permissions:
      contents: write
    concurrency:
      group: screenqr-appstore
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Pick a 6.9-inch iPhone simulator
        run: |
          cat > "$RUNNER_TEMP/pick.py" <<'PY'
          import json, sys
          best = None
          for runtime, items in json.load(sys.stdin)["devices"].items():
              if "iOS-26" not in runtime and "iOS-27" not in runtime:
                  continue
              for device in items:
                  name = device["name"]
                  if not name.startswith("iPhone") or "Pro Max" not in name:
                      continue
                  score = (runtime, name)
                  if best is None or score > best[0]:
                      best = (score, device["udid"], name, runtime)
          print(f"{best[1]} {best[2]} {best[3]}" if best else "")
          PY
          PICK=$(xcrun simctl list devices available -j | python3 "$RUNNER_TEMP/pick.py")
          echo "simulator: $PICK"
          test -n "$PICK"
          echo "UDID=${PICK%% *}" >> "$GITHUB_ENV"
      - name: Boot the simulator with a clean status bar (9:41)
        run: |
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time "9:41" \
            --dataNetwork wifi --wifiMode active --wifiBars 3 \
            --cellularMode active --cellularBars 4 \
            --batteryState charged --batteryLevel 100
      - name: Capture screens
        run: |
          set -o pipefail
          xcodebuild test -project ScreenQR.xcodeproj -scheme ScreenQR \
            -destination "id=$UDID" -resultBundlePath Shots.xcresult \
            -only-testing:ScreenQRUITests/AppStoreScreenshots \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee test.log | grep -E "Test (Case|Suite)|error:|\*\* TEST" || true
          grep -q "\*\* TEST SUCCEEDED \*\*" test.log
      - name: Show test errors
        if: failure()
        run: |
          grep -E "error:|failed|XCTAssert" test.log | sort -u | head -80 || true
      - name: Export raw screens
        run: |
          xcrun xcresulttool export attachments --path Shots.xcresult --output-path raw-export
          python3 - <<'PY'
          import json, os, re, shutil
          os.makedirs("raw", exist_ok=True)
          for test in json.load(open("raw-export/manifest.json")):
              for item in test.get("attachments", []):
                  exported = item.get("exportedFileName") or ""
                  label = item.get("suggestedHumanReadableName") or ""
                  match = re.match(r"(\d+-[a-z]+)_", label)
                  if match and exported.lower().endswith(".png"):
                      shutil.copy(os.path.join("raw-export", exported), os.path.join("raw", match.group(1) + ".png"))
          print(sorted(os.listdir("raw")))
          PY
          sips -g pixelWidth -g pixelHeight raw/*.png
      - name: Compose App Store images
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet pillow
          "$RUNNER_TEMP/venv/bin/python" AppStore/compose.py raw out
          sips -g pixelWidth -g pixelHeight out/*.png
      - uses: actions/upload-artifact@v4
        with:
          name: ScreenQR-AppStore-images
          path: out/*.png
      - name: Publish "screenqr-appstore" release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          (cd out && zip -q ../ScreenQR-AppStore-images.zip *.png)
          TITLE="Screen QR Scanner 앱 스토어 이미지"
          NOTES="screenshot-1~6: 1320×2868 (6.9형 iPhone, App Store Connect에 순서대로 올리면 검색 결과에는 앞의 3장이 나와요) · header-1920x1080: 헤더/홍보 이미지 · ScreenQR-AppStore-images.zip: 전부 (커밋 ${GITHUB_SHA::7})"
          if gh release view screenqr-appstore >/dev/null 2>&1; then
            gh release upload screenqr-appstore out/*.png ScreenQR-AppStore-images.zip --clobber
            gh release edit screenqr-appstore --title "$TITLE" --notes "$NOTES"
          else
            gh release create screenqr-appstore out/*.png ScreenQR-AppStore-images.zip --target "$GITHUB_SHA" --prerelease --title "$TITLE" --notes "$NOTES"
          fi
      - name: Print images (base64, for review)
        run: |
          mkdir -p preview
          for f in out/*.png; do
            sips -s format jpeg -s formatOptions 90 "$f" --out "preview/$(basename "${f%.png}").jpg" >/dev/null
          done
          ls -la preview
          for f in preview/*.jpg; do
            echo "=====BEGIN $(basename "$f")====="
            base64 -b 4000 -i "$f"
            echo "=====END $(basename "$f")====="
          done
