name: App Store images

# 앱 스토어에 올릴 이미지를 실제 앱 화면으로 만든다.
# - 아이폰 스크린샷 6장: 1320×2868(6.9형) + 같은 그림을 줄인 1206×2622(6.3형)
# - 아이패드 스크린샷 6장: 2064×2752(13형)
# - 아이폰 듀오 스크린샷 6장: 1398×2034(접은 바깥 화면)
# - 헤더 이미지: 3840×1646 · 5244×2950 (AppStore/에 있는 SQRS 로고 그림)
# 시뮬레이터에서 화면을 찍고(AppStoreScreenshots UI 테스트), AppStore/compose.py가 문구와 기기 틀을 입힌다.
# 결과는 "screenqr-appstore" 릴리스에 올라간다. Actions 탭에서 직접 실행하거나 아래 파일이 바뀌면 실행된다.
# 직접 실행할 때 기기를 고르면 그 기기 이미지만 다시 찍어 바꾸고, 나머지는 릴리스에 있는 그대로 둔다.
on:
  workflow_dispatch:
    inputs:
      devices:
        description: "다시 찍을 기기"
        type: choice
        default: all
        options: [all, duo, iphone-ipad]
  push:
    paths:
      - "AppStore/**"
      - "ScreenQRUITests/AppStoreScreenshots.swift"
      - "ScreenQRUITests/DuoScreen.swift"
      - ".github/workflows/appstore.yml"

jobs:
  images:
    runs-on: xcode-27
    permissions:
      contents: write
    concurrency:
      group: screenqr-appstore
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 27.1
        run: |
          XCODE=/Applications/Xcode_27.1.app
          [ -d "$XCODE" ] || XCODE=$(ls -d /Applications/Xcode_27*.app | grep -v -i -E "beta|candidate" | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Pick the simulators (6.9-inch iPhone, 13-inch iPad, iPhone Duo)
        run: |
          cat > "$RUNNER_TEMP/pick.py" <<'PY'
          import json, sys
          want = sys.argv[1]
          best = None
          for runtime, items in json.load(sys.stdin)["devices"].items():
              if "iOS-26" not in runtime and "iOS-27" not in runtime:
                  continue
              for device in items:
                  name = device["name"]
                  if want == "iphone":
                      # 1320×2868 (App Store 6.9형). 17 Pro Max를 먼저 고른다.
                      if not name.startswith("iPhone") or "Pro Max" not in name:
                          continue
                      score = (name == "iPhone 17 Pro Max", runtime, name)
                  elif want == "ipad":
                      # 2064×2752 (App Store 13형)
                      if not name.startswith("iPad Pro 13-inch"):
                          continue
                      score = (runtime, name)
                  else:
                      # 아이폰 듀오 (iOS 27.1 런타임)
                      if name != "iPhone Duo":
                          continue
                      score = (runtime, name)
                  if best is None or score > best[0]:
                      best = (score, device["udid"], name, runtime)
          print(f"{best[1]} {best[2]} {best[3]}" if best else "")
          PY
          IPHONE=$(xcrun simctl list devices available -j | python3 "$RUNNER_TEMP/pick.py" iphone)
          IPAD=$(xcrun simctl list devices available -j | python3 "$RUNNER_TEMP/pick.py" ipad)
          DUO=$(xcrun simctl list devices available -j | python3 "$RUNNER_TEMP/pick.py" duo)
          echo "iPhone: $IPHONE"
          echo "iPad: $IPAD"
          echo "iPhone Duo: $DUO"
          test -n "$IPHONE" && test -n "$IPAD" && test -n "$DUO"
          echo "IPHONE=${IPHONE%% *}" >> "$GITHUB_ENV"
          echo "IPAD=${IPAD%% *}" >> "$GITHUB_ENV"
          echo "DUO=${DUO%% *}" >> "$GITHUB_ENV"
          # 시뮬레이터를 켜고 상태 막대를 9:41로 고정한다.
          cat > "$RUNNER_TEMP/boot.sh" <<'SH'
          for UDID in "$@"; do
            xcrun simctl boot "$UDID" || true
            xcrun simctl bootstatus "$UDID" -b
            xcrun simctl status_bar "$UDID" override --time "9:41" \
              --dataNetwork wifi --wifiMode active --wifiBars 3 \
              --cellularMode active --cellularBars 4 \
              --batteryState discharging --batteryLevel 100
          done
          SH
      # 아이폰 듀오는 접은 바깥 화면을 찍는다. Xcode에는 접고 펴는 명령이 없어서, Device Hub의 경첩 슬라이더와
      # 같은 신호를 보내는 공개 도구 duo-hinge(MIT, github.com/tosbaha/duo-fold-control)를 고정된 버전 · 해시로 받아 쓴다.
      # 비공개 시뮬레이터 기능에 기대므로, 여기서 실패해도 아이폰 · 아이패드 이미지는 그대로 만든다.
      - name: Capture iPhone Duo screens (folded)
        if: inputs.devices != 'iphone-ipad'
        continue-on-error: true
        timeout-minutes: 30
        run: |
          curl -fsSL -o "$RUNNER_TEMP/duo-hinge.m" \
            "https://raw.githubusercontent.com/tosbaha/duo-fold-control/6207cc897648959c3c2213ac3a2dcf38f6f9eb41/tools/duo-hinge.m"
          echo "771a6ef85afaa95ed2868b35c2966872e958e2675042edf940e396a411ffdb0c  $RUNNER_TEMP/duo-hinge.m" | shasum -a 256 -c -
          clang -fobjc-arc -framework Foundation -o "$RUNNER_TEMP/duo-hinge" "$RUNNER_TEMP/duo-hinge.m"
          bash "$RUNNER_TEMP/boot.sh" "$DUO"
          DEVELOPER_DIR="$(xcode-select -p)" "$RUNNER_TEMP/duo-hinge" -d "$DUO" closed
          sleep 3
          set -o pipefail
          TEST_RUNNER_DUO_STATE=closed xcodebuild test -project ScreenQR.xcodeproj -scheme ScreenQR \
            -destination "id=$DUO" -resultBundlePath "Shots-duo.xcresult" \
            -only-testing:ScreenQRUITests/AppStoreScreenshots \
            -retry-tests-on-failure -test-iterations 2 \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee "test-duo.log" | grep -E "Test (Case|Suite)|error:|\*\* TEST" || true
          xcrun simctl shutdown "$DUO" || true
          grep -q "\*\* TEST SUCCEEDED \*\*" "test-duo.log"
      - name: Capture iPhone and iPad screens
        if: inputs.devices != 'duo'
        run: |
          bash "$RUNNER_TEMP/boot.sh" "$IPHONE" "$IPAD"
          set -o pipefail
          for DEVICE in iphone ipad; do
            if [ "$DEVICE" = iphone ]; then UDID="$IPHONE"; else UDID="$IPAD"; fi
            xcodebuild test -project ScreenQR.xcodeproj -scheme ScreenQR \
              -destination "id=$UDID" -resultBundlePath "Shots-$DEVICE.xcresult" \
              -only-testing:ScreenQRUITests/AppStoreScreenshots \
              -retry-tests-on-failure -test-iterations 2 \
              CODE_SIGNING_ALLOWED=NO 2>&1 | tee "test-$DEVICE.log" | grep -E "Test (Case|Suite)|error:|\*\* TEST" || true
            grep -q "\*\* TEST SUCCEEDED \*\*" "test-$DEVICE.log"
          done
      - name: Show test errors
        if: always()
        run: |
          grep -h -E "error:|failed|XCTAssert" test-*.log 2>/dev/null | sort -u | head -80 || true
      - name: Export raw screens
        run: |
          for DEVICE in iphone ipad duo; do
            [ -d "Shots-$DEVICE.xcresult" ] || { echo "no $DEVICE screens"; continue; }
            xcrun xcresulttool export attachments --path "Shots-$DEVICE.xcresult" --output-path "raw-export-$DEVICE" || true
            [ -f "raw-export-$DEVICE/manifest.json" ] || { echo "no $DEVICE attachments"; continue; }
            python3 - "raw-export-$DEVICE" "raw-$DEVICE" <<'PY'
          import json, os, re, shutil, sys
          source, target = sys.argv[1], sys.argv[2]
          os.makedirs(target, exist_ok=True)
          for test in json.load(open(os.path.join(source, "manifest.json"))):
              for item in test.get("attachments", []):
                  exported = item.get("exportedFileName") or ""
                  label = item.get("suggestedHumanReadableName") or ""
                  match = re.match(r"(\d+-[a-z]+)_", label)
                  if match and exported.lower().endswith(".png"):
                      shutil.copy(os.path.join(source, exported), os.path.join(target, match.group(1) + ".png"))
          print(target, sorted(os.listdir(target)))
          PY
            sips -g pixelWidth -g pixelHeight -g orientation "raw-$DEVICE"/*.png || true
          done
      - name: Compose App Store images
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet pillow
          if [ "${{ inputs.devices }}" != duo ]; then
            "$RUNNER_TEMP/venv/bin/python" AppStore/compose.py raw-iphone out
            "$RUNNER_TEMP/venv/bin/python" AppStore/compose.py --ipad raw-ipad out
          fi
          if [ "$(ls raw-duo/*.png 2>/dev/null | wc -l)" -ge 6 ]; then
            "$RUNNER_TEMP/venv/bin/python" AppStore/compose.py --duo raw-duo out
          elif [ "${{ inputs.devices }}" != iphone-ipad ]; then
            echo "::warning::아이폰 듀오 화면을 다 찍지 못해서 듀오 이미지는 이번에 만들지 않았어요"
          fi
          sips -g pixelWidth -g pixelHeight out/*.png
      - uses: actions/upload-artifact@v4
        with:
          name: ScreenQR-AppStore-images
          path: out/*.png
      - name: Publish "screenqr-appstore" release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # zip에는 이번에 새로 만든 것과 릴리스에 이미 있는 나머지를 함께 담는다 (기기를 골라 실행했을 때도 전부 들어가게).
          mkdir -p all
          gh release download screenqr-appstore --pattern "*.png" --dir all --clobber || true
          cp out/*.png all/
          (cd all && zip -q ../ScreenQR-AppStore-images.zip *.png)
          TITLE="Screen QR Scanner 앱 스토어 이미지"
          NOTES="App Store Connect에 순서대로(1→6) 올리면 돼요. 검색 결과에는 앞의 3장이 나와요.
          - 아이폰 6.3형 칸(1206×2622): screenshot-1~6-…-1206x2622
          - 아이폰 6.9형 칸(1320×2868): screenshot-1~6
          - 아이패드 13형 칸(2064×2752): ipad-screenshot-1~6
          - 아이폰 듀오 칸(1398×2034, 접은 화면): duo-screenshot-1~6
          - 헤더: header-3840x1646(헤더 전용) · header-5244x2950(헤더와 검색 결과 겸용, PNG)
          - ScreenQR-AppStore-images.zip: 전부 (커밋 ${GITHUB_SHA::7})"
          if gh release view screenqr-appstore >/dev/null 2>&1; then
            gh release upload screenqr-appstore out/*.png ScreenQR-AppStore-images.zip --clobber
            gh release edit screenqr-appstore --title "$TITLE" --notes "$NOTES"
            # 예전 1920×1080 헤더는 App Store Connect가 받지 않아서 지운다.
            gh release delete-asset screenqr-appstore header-1920x1080.png -y || true
          else
            gh release create screenqr-appstore out/*.png ScreenQR-AppStore-images.zip --target "$GITHUB_SHA" --prerelease --title "$TITLE" --notes "$NOTES"
          fi
      - name: Print images (base64, for review)
        run: |
          mkdir -p preview
          # 원본 크기 이미지는 릴리스에 있으니, 로그에는 확인용으로 줄여서 남긴다 (6.3형 사본과 헤더는 빼고).
          for f in out/*.png; do
            case "$f" in *-1206x2622.png|*header-*) continue ;; esac
            sips -s format jpeg -s formatOptions 85 --resampleWidth 900 "$f" --out "preview/$(basename "${f%.png}").jpg" >/dev/null
          done
          ls -la preview
          for f in preview/*.jpg; do
            echo "=====BEGIN $(basename "$f")====="
            base64 -b 4000 -i "$f"
            echo "=====END $(basename "$f")====="
          done
      - name: Check the iPhone Duo images
        if: always() && inputs.devices != 'iphone-ipad'
        run: |
          # 듀오 촬영은 다른 이미지를 막지 않으려고 실패해도 넘어가므로, 여기서 빠졌는지 알린다.
          COUNT=$(ls out/duo-screenshot-*.png 2>/dev/null | wc -l)
          echo "iPhone Duo images: $COUNT"
          test "$COUNT" -ge 6
