name: iOS Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build (unsigned)
        run: |
          xcodebuild -project ScreenQR.xcodeproj -scheme ScreenQR \
            -destination 'generic/platform=iOS' -configuration Debug \
            CODE_SIGNING_ALLOWED=NO build
      - name: Check Safari extension bundle
        run: |
          APPEX=$(find ~/Library/Developer/Xcode/DerivedData -path '*Debug-iphoneos/ScreenQR.app/PlugIns/ScreenQRSafari.appex' -maxdepth 6 | head -1)
          ls -R "$APPEX"
          for f in Info.plist manifest.json popup.html popup.js popup.css images/icon-128.png images/toolbar-38.png; do
            test -f "$APPEX/$f" || { echo "missing $f"; exit 1; }
          done
