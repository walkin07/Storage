name: ScreenQR
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # 번들 ID. CI에서는 저장소 변수 APP_BUNDLE_ID로 바꿀 수 있고, 확장 프로그램은 뒤에 .safari가 붙는다.
    APP_BUNDLE_ID: io.github.walkin07.screenqr
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
targets:
  ScreenQR:
    type: application
    platform: iOS
    sources: [ScreenQR]
    scheme: {}
    dependencies:
      - target: ScreenQRSafari
    info:
      path: ScreenQR/Info.plist
      properties:
        CFBundleDisplayName: 화면 QR
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        UIUserInterfaceStyle: Light
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: screenqr
            CFBundleURLSchemes: [screenqr]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  ScreenQRSafari:
    type: app-extension
    platform: iOS
    sources:
      - SafariExtension/SafariWebExtensionHandler.swift
      - ScreenQR/QRDecoder.swift
      # 웹 확장 파일은 확장 번들 최상위에 그대로 복사된다 (images/ 폴더는 유지)
      - path: SafariExtension/Resources
        excludes: ["images/**"]
        buildPhase: resources
      - path: SafariExtension/Resources/images
        type: folder
        buildPhase: resources
    info:
      path: SafariExtension/Info.plist
      properties:
        CFBundleDisplayName: 화면 QR
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.Safari.web-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SafariWebExtensionHandler
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).safari
