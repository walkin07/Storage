name: ScreenQR
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  ScreenQR:
    type: application
    platform: iOS
    sources: [ScreenQR]
    scheme: {}
    info:
      path: ScreenQR/Info.plist
      properties:
        CFBundleDisplayName: 화면 QR
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        CFBundleURLTypes:
          - CFBundleURLName: screenqr
            CFBundleURLSchemes: [screenqr]
    settings:
      base:
        # 본인 것으로 바꿔도 됩니다 (Xcode에서 Signing & Capabilities → Team 선택)
        PRODUCT_BUNDLE_IDENTIFIER: com.example.screenqr
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
