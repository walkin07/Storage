name: ScreenQR
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
targets:
  ScreenQR:
    type: application
    platform: iOS
    sources: [ScreenQR]
    scheme: {}
    dependencies:
      - target: ScreenQRSafari
    info:
      path: ScreenQR/Info.plist
      properties:
        CFBundleDisplayName: 화면 QR
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        UIUserInterfaceStyle: Light
        CFBundleURLTypes:
          - CFBundleURLName: screenqr
            CFBundleURLSchemes: [screenqr]
    settings:
      base:
        # 본인 것으로 바꿔도 됩니다. 확장 프로그램 ID는 이 값 + ".safari" 여야 해요.
        PRODUCT_BUNDLE_IDENTIFIER: com.example.screenqr
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  ScreenQRSafari:
    type: app-extension
    platform: iOS
    sources:
      - SafariExtension/SafariWebExtensionHandler.swift
      - ScreenQR/QRDecoder.swift
      # 웹 확장 파일은 확장 번들 최상위에 그대로 복사된다 (images/ 폴더는 유지)
      - path: SafariExtension/Resources
        excludes: ["images/**"]
        buildPhase: resources
      - path: SafariExtension/Resources/images
        type: folder
        buildPhase: resources
    info:
      path: SafariExtension/Info.plist
      properties:
        CFBundleDisplayName: 화면 QR
        NSExtension:
          NSExtensionPointIdentifier: com.apple.Safari.web-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SafariWebExtensionHandler
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.screenqr.safari
